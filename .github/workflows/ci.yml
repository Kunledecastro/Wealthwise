name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Create database roles
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE wealthwise_migrator LOGIN PASSWORD 'devpass';
          CREATE ROLE wealthwise_app LOGIN PASSWORD 'devpass';
          CREATE DATABASE wealthwise_test OWNER wealthwise_migrator;
          SQL
          psql -h localhost -U postgres -d wealthwise_test -c "CREATE EXTENSION citext; GRANT USAGE ON SCHEMA public TO wealthwise_app; GRANT ALL ON SCHEMA public TO wealthwise_migrator;"
      - name: Install
        working-directory: api
        run: uv sync --frozen
      - name: Lint and type-check
        working-directory: api
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy app
      - name: Migration round-trip
        run: ./scripts/migrate_check.sh
      - name: Tests
        working-directory: api
        run: uv run pytest
      - name: Dependency audit
        working-directory: api
        run: uv run pip-audit

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --prod

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: cp .env.example .env && docker compose config --quiet
      - name: Simulate a Windows checkout (CRLF line endings in the DB init script)
        run: sed -i 's/$/\r/' deploy/postgres/01-roles.sh && file deploy/postgres/01-roles.sh
      - name: Build images
        shell: bash
        run: |
          set -o pipefail
          if ! docker compose build --progress=plain db api web 2>&1 | tee build.log; then
            # Surface the failure as an annotation (readable without opening raw logs).
            msg=$(grep -E "ERROR|error|failed|ERR_" build.log | tail -n 25 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Docker build failed::${msg}"
            exit 1
          fi
      - name: Start the full stack and check health (same as manual test M1)
        shell: bash
        run: |
          set -o pipefail
          sed -i 's/^SECRET_KEY=.*/SECRET_KEY=ci-only-secret-0123456789abcdefghijklmnop/' .env
          ok=1
          docker compose up -d || ok=0
          if [ $ok = 1 ]; then
            for i in $(seq 1 60); do curl -fsS http://localhost:3000/api/health && break; sleep 3; done
            curl -fsS http://localhost:3000/api/health >/dev/null || ok=0
          fi
          if [ $ok = 0 ]; then
            docker compose ps -a
            msg=$(docker compose logs --no-color db migrate api 2>&1 | tail -n 40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Stack failed to start::${msg}"
            exit 1
          fi
          echo
          docker compose ps -a
          WW_ADMIN_PASSWORD=Ci-Admin-Passphrase-77 docker compose run --rm -e WW_ADMIN_PASSWORD api python -m app.cli create-admin --email ci@example.com --name CI
